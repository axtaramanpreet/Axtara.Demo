<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The mark axtara.ai uses beside the wordmark: a square outline turned 45°.
    Taken from the site rather than invented — it is drawn there as an 11px
    span with a 1px border and `transform: rotate(45deg)`.

    A favicon cannot inherit a colour, so the two themes are declared here. A
    single dark diamond disappears on a dark tab strip, which is where most of
    these sit.
  -->
  <style>
    .d { fill: none; stroke: #0a0a0c; stroke-width: 2.4 }
    @media (prefers-color-scheme: dark) { .d { stroke: #f5f7fa } }
  </style>
  <rect class="d" x="9" y="9" width="14" height="14" transform="rotate(45 16 16)"/>
</svg>
